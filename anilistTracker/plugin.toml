id = "HotZi/anilistTracker"
name = "Anilist Tracker"
version = "1.1.0"
plugin_api = 3
min_noctalia = "5.0.0"
author = "HotZi"
icon = "device-tv"
description = "Track your AniList anime from the bar, with a list panel and an activity feed."
tags = ["media", "bar", "panel"]
dependencies = ["python3", "xdg-open"]

[[widget]]
id = "animetracker"
entry = "widget.luau"

  [[widget.setting]]
  key = "anilist_token"
  type = "string"
  label_key = "AniList Access Token"
  description_key = "Optional. Leave empty and use Log in with AniList in the panel instead."
  default = ""

[[panel]]
id = "anilistPanel"
entry = "panel.luau"
width = 520
height = 480
placement = "attached"
position = "auto"


[[panel]]
id = "activityPanel"
entry = "activity.luau"
width = 520
height = 370
placement = "attached"
position = "auto"


[[panel]]
id = "searchPanel"
entry = "search.luau"
width = 600
height = 620
placement = "attached"
position = "auto"
